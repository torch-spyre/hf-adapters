name: Prune VLM reference cache

on:
  schedule:
    # Sundays at 04:43 UTC.
    - cron: "43 4 * * 0"
  workflow_dispatch:
    inputs:
      max_age_days:
        description: Retain references accessed or modified within this many days
        type: string
        default: "30"
        required: true
      dry_run:
        description: Preview expired references without deleting them
        type: boolean
        default: true
        required: true
  pull_request:
    branches: [main]
    paths:
      - .github/cache_config/prune_vlm_reference_cache.py
      - .github/cache_config/test_prune_vlm_reference_cache.py
      - .github/workflows/prune_vlm_reference_cache.yaml
  push:
    branches: [main]
    paths:
      - .github/cache_config/prune_vlm_reference_cache.py
      - .github/cache_config/test_prune_vlm_reference_cache.py
      - .github/workflows/prune_vlm_reference_cache.yaml

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Cache maintenance tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test reference cleanup
        run: >-
          python3 -m unittest discover -s .github/cache_config
          -p 'test_prune_vlm_reference_cache.py' -v

  prune:
    name: Prune expired VLM references
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on:
      - x86_64
      - spyre_pf_x0
      - linux
      - image_torch_spyre
    timeout-minutes: 10
    concurrency:
      group: prune-vlm-reference-cache
      cancel-in-progress: false
    env:
      HF_ADAPTERS_VLM_REF_CACHE: /storage-1/hf-adapters/.cache/vlm-references
      MAX_AGE_DAYS: ${{ inputs.max_age_days || '30' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prune reference cache
        run: |
          args=(--cache-dir "$HF_ADAPTERS_VLM_REF_CACHE" --max-age-days "$MAX_AGE_DAYS")
          if [[ "$DRY_RUN" == "false" ]]; then
            args+=(--delete)
          fi
          python3 .github/cache_config/prune_vlm_reference_cache.py "${args[@]}"
