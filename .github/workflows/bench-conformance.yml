name: bench-conformance

# Advisory check that benchmarks/ validates and that its identity blocks derive the ids the ingest writes.
# Hosted runner, no cards, no secrets. Not a required check.
on:
  pull_request:
    branches: [main, release-*]
    paths:
      - benchmarks/**
      - mk/bench.mk
      - scripts/generate_bench_definitions.py
      - scripts/bench_model_cases.py
      - evals/gsm8k/gsm8k_samples.json
      - evals/mmlu/mmlu_samples.json
      - tests/model_lists/perf.yaml
      - tests/model_lists/perf_bench.yaml
      - .github/workflows/bench-conformance.yml
  workflow_dispatch: null

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  conformance:
    name: Benchmark definitions and identity conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest-known
      # The engine and the ingest live in torch-spyre; the ingest is the single source of the id rule.
      - name: Install the engine and the ingest
        run: |
          uv venv
          base="git+https://github.com/torch-spyre/torch-spyre@main"
          uv pip install lxml pytest pyyaml regex clickhouse-connect \
            "spyre-bench @ ${base}#subdirectory=extensions/spyre-bench" \
            "spyre-clickhouse-ingest @ ${base}#subdirectory=extensions/clickhouse-ingest"
      - name: Validate, check ids, run the tests
        run: |
          export PATH="${GITHUB_WORKSPACE}/.venv/bin:${PATH}"
          python scripts/generate_bench_definitions.py --check
          make bench-validate BENCH_REQUIRED=1
          make bench-check-ids
          python -m pytest -q -p no:cacheprovider benchmarks/tests
