name: Qwen3-VL vision diagnostic
on:
  workflow_dispatch:
    inputs:
      cache_config_file:
        type: string
        default: '.github/cache_config/hf_models_and_datasets.yaml'
      force_download:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  probe:
    runs-on: [x86_64, spyre_pf_x1, linux, image_torch_spyre]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cp .github/scripts/qwen_vl_vision_probe.py /tmp/qwen_vl_vision_probe.py
      - uses: ./.github/actions/build-hf-adapters
        with:
          uv_groups: 'dev spyre test'
          ref: feat/qwen3-vl-embedding
          prebaked_image: true
      - name: Probe vision parity
        shell: bash
        run: |
          source "$HOME/.bashrc"
          source /etc/profile.d/ibm-aiu-setup.sh
          cd "$CLONED_HF_ADAPTERS_DIR"
          PYTHONPATH="$CLONED_HF_ADAPTERS_DIR" python -u /tmp/qwen_vl_vision_probe.py
