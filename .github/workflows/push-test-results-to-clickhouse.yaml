name: push-test-results-to-clickhouse

# Ingests JUnit XML results from hf-adapters' own model-centric e2e suites
# into ClickHouse via .github/scripts/ingest_xml_hf_adapters.py, writing to
# hf_test_runs / hf_test_cases / hf_run_properties. Triggered by both
# workflows that produce those suites:
#   - test_pull_request.yaml (hf-adapters' PR/trunk workflow)
#   - integration-tests.yaml (delegates to _test_matrix.yaml, which runs the
#     same suites -- smoke, load, token_compare, embed_compare, vlm,
#     model_module -- against upstream-triggered or manually dispatched refs)
# Also supports manual dispatch for re-ingesting a specific run.
#
# NOTE: this filename is deliberately NOT push-to-clickhouse.yaml -- that name
# is already taken by this repo's unrelated HF-Hub weekly-model-scan cron job,
# which references the same CLICKHOUSE_* secrets for its own purposes.
on:
  workflow_run:
    workflows:
      - integration-tests
      - test_pull_request
    types: [completed]
  workflow_dispatch:
    inputs:
      gha_run_id:
        description: GHA run ID to re-ingest (leave blank to skip)
        required: false
        default: ''
      workflow_name:
        description: Workflow name (integration-tests | test_pull_request)
        required: false
        default: integration-tests

concurrency:
  # Allow at most one ingest per triggering run (re-runs queue behind)
  group: ingest-${{ github.event.workflow_run.id || inputs.gha_run_id || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # needed to download artifacts from the triggering run

jobs:
  ingest:
    name: Ingest XML -> ClickHouse
    runs-on:
      - x86_64
      - linux
      - image_ingest
    timeout-minutes: 15
    # Skip if the triggering workflow was cancelled (but ingest failures are fine)
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion != 'cancelled'

    env:
      # ---------------------------------------------------------------------------
      # Set these secrets in your repo / org settings:
      #   CLICKHOUSE_HOST   e.g. clickhouse.internal.example.com
      #   CLICKHOUSE_PORT   e.g. 8123  (HTTP interface)
      #   CLICKHOUSE_USER   e.g. spyre_writer
      #   CLICKHOUSE_PASS   the password
      #   CLICKHOUSE_DB     e.g. spyre
      # ---------------------------------------------------------------------------
      CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST }}
      CLICKHOUSE_PORT: ${{ secrets.CLICKHOUSE_PORT }}
      CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
      CLICKHOUSE_PASS: ${{ secrets.CLICKHOUSE_PASS }}
      CLICKHOUSE_DB: ${{ secrets.CLICKHOUSE_DB }}
      # Schema-v2 database. Reached by QUALIFYING every v2 statement rather than by a second
      # connection: test_cases exists in both generations with incompatible shapes, so an
      # unqualified name would hit the wrong one. Unset/empty makes the v2 write a no-op, so
      # this is safe before the secret exists.
      CLICKHOUSE_DB_V2: ${{ secrets.CLICKHOUSE_DB_V2 }}
      # Dual-write during the migration window: v1 stays authoritative while v2 accumulates
      # the same runs. No data is ported (v1 rows cannot produce a v2 run_id, the hash inputs
      # were never recorded per row), so `both` is how v2 gets any history at all.
      INGEST_SCHEMA: both

      # Metadata about the triggering run
      TRIGGERING_RUN_ID: ${{ github.event.workflow_run.id || inputs.gha_run_id }}
      TRIGGERING_WORKFLOW: ${{ github.event.workflow_run.name || inputs.workflow_name }}
      TRIGGERING_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      TRIGGERING_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      TRIGGERING_AT: ${{ github.event.workflow_run.created_at || '' }}
      # display_title carries "integration-tests (<test_type>)" via that
      # workflow's run-name, or the bare tier ("trunk" / "regression")
      # via test_pull_request's -- the only way this job can recover which
      # tier ran without an extra API call.
      TRIGGERING_DISPLAY_TITLE: ${{ github.event.workflow_run.display_title || '' }}
      # Triggering event (push/pull_request/schedule/workflow_dispatch/merge_group; empty on manual re-ingest) -- gates the PR-number lookup below.
      TRIGGERING_EVENT: ${{ github.event.workflow_run.event || '' }}

    steps:
      # workflow_run always executes this file as it exists on the default
      # branch, so a plain checkout (no ref:) here pulls the canonical copy
      # of the ingest script regardless of which ref triggered the run.
      - name: Checkout ingest script
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          sparse-checkout: |
            .github/scripts/ingest_xml_hf_adapters.py
          sparse-checkout-cone-mode: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: setup venv
        run: |
          uv venv
          source .venv/bin/activate
          echo "VIRTUAL_ENV $VIRTUAL_ENV"

      - name: Install Python dependencies
        run: |
          source .venv/bin/activate
          uv pip install requests clickhouse-driver clickhouse-connect lxml regex \
            "git+https://github.com/torch-spyre/torch-spyre@main#subdirectory=extensions/clickhouse-ingest"

      - name: Install gh CLI
        env:
          # Offline floor only: used when api.github.com can't be reached to resolve the
          # latest release, so a transient API failure degrades to a known-good gh instead
          # of failing the job.
          GH_CLI_VERSION_FLOOR: 2.98.0
        run: |
          set -euo pipefail
          # Track the latest gh release rather than a pin: nothing here depends on a
          # specific gh version, and a pin silently rots (this fleet had 2.92.0 and 2.97.0
          # drifting apart across workflows).
          ver="$(curl -fsSL https://api.github.com/repos/cli/cli/releases/latest \
                   | jq -r '.tag_name // empty' | sed 's/^v//')" || ver=""
          if [ -z "$ver" ]; then
            echo "api.github.com unreachable; flooring to ${GH_CLI_VERSION_FLOOR}"
            ver="${GH_CLI_VERSION_FLOOR}"
          fi
          # curl, not wget: the ingest runner image (ghcr.io/actions/actions-runner)
          # ships curl but no wget.
          curl -fsSL "https://github.com/cli/cli/releases/download/v${ver}/gh_${ver}_linux_amd64.tar.gz" \
            -o gh.tar.gz
          tar -xzf gh.tar.gz
          echo "$PWD/gh_${ver}_linux_amd64/bin" >> "${GITHUB_PATH}"
          "gh_${ver}_linux_amd64/bin/gh" --version

      - name: Resolve PR number
        id: resolve-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # An unconditional commit->PR lookup stamped a trunk/scheduled run with whatever PR previously merged that commit; only trust it for an actual pull_request-triggered run.
          if [[ "${TRIGGERING_EVENT}" == "pull_request" ]]; then
            PR=$(gh api \
              "/repos/${{ github.repository }}/commits/${TRIGGERING_SHA}/pulls" \
              --jq '.[0].number // 0')
          else
            PR=0
          fi
          echo "Resolved PR number: ${PR} (triggering event: ${TRIGGERING_EVENT:-<manual dispatch>})"
          echo "pr_number=${PR}" >> "${GITHUB_OUTPUT}"

      # ---------------------------------------------------------------------------
      # Download every artifact from the triggering run and unzip it — artifact
      # *names* carry no file extension (only the file inside the zip does), so
      # filtering has to happen post-unzip by actual filename, not by artifact name.
      #
      # `--paginate` is required: the artifacts endpoint defaults to 30 per
      # page, and a run with more jobs than that silently lost every artifact
      # past the first page, with no error — rows just never showed up in
      # ClickHouse. `--paginate` applies `--jq` per page and concatenates the
      # filtered results across pages (`gh api` rejects `--slurp` combined
      # with `--jq`), so the per-artifact objects come out as a JSON stream,
      # not a single array; python3 slurps that stream into one array below.
      # ---------------------------------------------------------------------------
      - name: List artifacts from triggering run
        id: list-artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACTS=$(gh api --paginate \
            "/repos/${{ github.repository }}/actions/runs/${TRIGGERING_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | {id: .id, name: .name}' \
            | python3 -c "import json,sys; print(json.dumps([json.loads(l) for l in sys.stdin if l.strip()]))")
          echo "artifacts=$ARTIFACTS" >> "$GITHUB_OUTPUT"
          echo "Found artifacts:"
          echo "$ARTIFACTS" | python3 -c "import json,sys; [print(' •', a['name']) for a in json.load(sys.stdin)]"

      - name: Download XML artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p xml_artifacts
          export ARTIFACTS='${{ steps.list-artifacts.outputs.artifacts }}'
          python3 <<'PYEOF'
          import json, os, subprocess, sys
          from pathlib import Path

          artifacts = json.loads(os.environ['ARTIFACTS'])
          repo  = os.environ['GITHUB_REPOSITORY']
          for a in artifacts:
              print(f"Downloading: {a['name']} (id={a['id']})")
              with open(f"xml_artifacts/{a['name']}.zip", "wb") as f:
                result = subprocess.run([
                    "gh", "api",
                    f"/repos/{repo}/actions/artifacts/{a['id']}/zip",
                ], check=True, env={**os.environ}, capture_output=True)
                f.write(result.stdout)
              # Each artifact unzips into its OWN subdirectory (named after
              # the artifact, which is unique per suite+model) rather than a
              # shared flat one: a single-file artifact's upload strips its
              # model-key subdirectory, so two suites can both produce a
              # "Qwen3-0.6B.xml" and would otherwise clobber each other.
              # ingest_xml_hf_adapters.py globs --xml-dir recursively and
              # derives a unique filename from the path relative to it, so
              # this nesting is exactly what it expects.
              dest = Path("xml_artifacts") / a["name"]
              subprocess.run(
                  ["unzip", "-o", f"xml_artifacts/{a['name']}.zip", "-d", str(dest)],
                  check=True,
              )
          PYEOF
          echo "Downloaded XML files:"
          find xml_artifacts -name "*.xml" 2>/dev/null || echo "(none)"

      # The orchestrator's uuid, uploaded by _test_matrix as the `run-id` artifact (this
      # workflow runs on workflow_run, so it cannot receive it as a dispatch input). Absent on
      # a GHA-initiated run => empty => the ingest derives its own id from the run coordinate.
      - name: Recover threaded run_id
        id: threaded-run-id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RID=""
          AID=$(gh api --paginate \
            "/repos/${{ github.repository }}/actions/runs/${TRIGGERING_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "run-id") | .id' | head -1)
          if [[ -n "${AID}" ]]; then
            gh api "/repos/${{ github.repository }}/actions/artifacts/${AID}/zip" > run-id.zip || true
            unzip -o -q run-id.zip -d run-id-dir || true
            RID=$(tr -d '[:space:]' < run-id-dir/run-id.txt 2>/dev/null || echo "")
          fi
          echo "Threaded run_id: ${RID:-<none, ingest will derive>}"
          echo "run_id=${RID}" >> "${GITHUB_OUTPUT}"

      - name: Extract suite tier from display title
        id: extract-tier
        run: |
          if [[ "${TRIGGERING_DISPLAY_TITLE}" == *"("*")"* ]]; then
            # integration-tests' run-name is "integration-tests (<tier>)".
            TIER=$(echo "${TRIGGERING_DISPLAY_TITLE}" | sed -n 's/.*(\(.*\))\s*$/\1/p')
          else
            # test_pull_request's run-name is the bare tier itself ("trunk"
            # on push, "regression" otherwise) -- no parens to parse.
            TIER="${TRIGGERING_DISPLAY_TITLE}"
          fi
          echo "Resolved tier: ${TIER:-<none>}"
          echo "tier=${TIER}" >> "${GITHUB_OUTPUT}"

      # ---------------------------------------------------------------------------
      # Parse each XML file and insert rows into ClickHouse via
      # ingest_xml_hf_adapters.py (checked out above), into
      # hf_test_runs / hf_test_cases / hf_run_properties.
      # ---------------------------------------------------------------------------
      - name: Ingest XML files into ClickHouse
        env:
          # The arch the SUITE ran on, not this job's: arch is a run_id hash input and this
          # job is pinned to x86_64, so `uname -m` would stamp x86_64 on every leg it
          # ingests. All test legs are x86_64 today; this needs to become a per-leg value
          # (carried like the run-id artifact) before a non-x86 leg is added.
          LEG_ARCH: x86_64
          # Routed through env rather than interpolated into the script below: this job runs on
          # workflow_run, a privileged secrets-bearing trigger, and the value reaches us from a
          # downloaded artifact originating outside this workflow.
          THREADED_RUN_ID: ${{ steps.threaded-run-id.outputs.run_id }}
          # Same reasoning: PR_NUMBER comes from the triggering run's payload and TIER is parsed
          # out of its run-name, so neither is trusted input to a shell here.
          PR_NUMBER: ${{ steps.resolve-pr.outputs.pr_number }}
          TIER: ${{ steps.extract-tier.outputs.tier }}
        run: |
          source .venv/bin/activate
          python3 .github/scripts/ingest_xml_hf_adapters.py \
            --xml-dir xml_artifacts \
            --workflow "${TRIGGERING_WORKFLOW}" \
            --branch   "${TRIGGERING_BRANCH}" \
            --sha      "${TRIGGERING_SHA}" \
            --gha-run-id "${TRIGGERING_RUN_ID}" \
            --run-id "${THREADED_RUN_ID}" \
            --triggered-at "${TRIGGERING_AT}" \
            --pr-number    "${PR_NUMBER}" \
            --trigger-type "${TIER}" \
            --platform "${LEG_ARCH}"

      - name: Summary
        if: always()
        run: |-
          XML_COUNT=$(find xml_artifacts -name "*.xml" 2>/dev/null | wc -l || echo 0)
          {
            echo "### ClickHouse Ingest Summary"
            echo "| Key | Value |"
            echo "|---|---|"
            echo "| Triggering workflow | ${TRIGGERING_WORKFLOW} |"
            echo "| Triggering run ID   | ${TRIGGERING_RUN_ID} |"
            echo "| Suite tier          | ${{ steps.extract-tier.outputs.tier }} |"
            echo "| PR number           | ${{ steps.resolve-pr.outputs.pr_number }} |"
            echo "| Branch              | ${TRIGGERING_BRANCH} |"
            echo "| Commit SHA          | ${TRIGGERING_SHA:0:12} |"
            echo "| XML files ingested  | ${XML_COUNT} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Ingest raw GHA job logs from spyre-model-module-tests into ClickHouse.
  # Runs alongside the existing XML ingest whenever integration-tests or
  # test_pull_request completes — those are the only two workflows that actually
  # run spyre-model-module-tests (test_daily sets edge_cases_only:true which
  # skips module tests entirely, so it is deliberately not in the trigger list).
  # Produces two richer tables: module_test_suites + module_test_variants.
  # ---------------------------------------------------------------------------
  ingest-module-logs:
    name: Ingest module-test logs -> ClickHouse
    runs-on:
      - x86_64
      - linux
      - image_ingest
    timeout-minutes: 20
    # Only fire when integration-tests completes (not on every PR / test_pull_request run).
    # For manual re-ingest, only accept workflow_name == 'integration-tests'.
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.workflow_name == 'integration-tests') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.name == 'integration-tests' &&
       github.event.workflow_run.conclusion != 'cancelled')

    env:
      CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST }}
      CLICKHOUSE_PORT: ${{ secrets.CLICKHOUSE_PORT }}
      CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
      CLICKHOUSE_PASS: ${{ secrets.CLICKHOUSE_PASS }}
      CLICKHOUSE_DB:   ${{ secrets.CLICKHOUSE_DB }}
      TRIGGERING_RUN_ID:  ${{ github.event.workflow_run.id || inputs.gha_run_id }}
      TRIGGERING_BRANCH:  ${{ github.event.workflow_run.head_branch || github.ref_name }}
      TRIGGERING_SHA:     ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      # Always check out from default branch so the scripts are canonical
      - name: Checkout ingest scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          sparse-checkout: |
            .github/scripts/parse_module_test_logs.py
            .github/scripts/ingest_module_tests.py
            tests/configs/module_tests
          sparse-checkout-cone-mode: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up venv and install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install clickhouse-connect pyyaml

      - name: Install gh CLI
        env:
          GH_CLI_VERSION_FLOOR: 2.98.0
        run: |
          set -euo pipefail
          ver="$(curl -fsSL https://api.github.com/repos/cli/cli/releases/latest \
                   | jq -r '.tag_name // empty' | sed 's/^v//')" || ver=""
          if [ -z "$ver" ]; then
            echo "api.github.com unreachable; flooring to ${GH_CLI_VERSION_FLOOR}"
            ver="${GH_CLI_VERSION_FLOOR}"
          fi
          curl -fsSL "https://github.com/cli/cli/releases/download/v${ver}/gh_${ver}_linux_amd64.tar.gz" \
            -o gh.tar.gz
          tar -xzf gh.tar.gz
          echo "$PWD/gh_${ver}_linux_amd64/bin" >> "${GITHUB_PATH}"

      # ---------------------------------------------------------------------------
      # Download the raw job logs for every "Spyre model-module tests" job leg
      # from the triggering run. Each leg corresponds to one config/model YAML.
      # The GHA jobs API lists all jobs for the run; we filter by name prefix and
      # download the text log for each matching job into raw_logs/.
      # ---------------------------------------------------------------------------
      - name: Download model-module test job logs
        id: download-logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p raw_logs

          # List all jobs for the triggering run, filter to "Spyre model-module tests" legs
          gh api --paginate \
            "/repos/${{ github.repository }}/actions/runs/${TRIGGERING_RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | select(.name | startswith("Spyre model-module tests")) | {id: .id, name: .name}' \
          | python3 -c "
          import json, sys
          jobs = [json.loads(l) for l in sys.stdin if l.strip()]
          print(json.dumps(jobs))
          " > jobs.json

          JOB_COUNT=$(python3 -c "import json; print(len(json.load(open('jobs.json'))))")
          echo "Found ${JOB_COUNT} model-module test job(s)"
          echo "job_count=${JOB_COUNT}" >> "${GITHUB_OUTPUT}"

          python3 - <<'PYEOF'
          import json, os, subprocess
          from pathlib import Path

          jobs    = json.load(open("jobs.json"))
          repo    = os.environ["GITHUB_REPOSITORY"]
          run_id  = os.environ["TRIGGERING_RUN_ID"]
          token   = os.environ["GH_TOKEN"]

          for job in jobs:
              job_id   = job["id"]
              job_name = job["name"]
              # Sanitise for use as filename: replace / and spaces
              safe     = job_name.replace("/", "_").replace(" ", "_")
              out_path = Path("raw_logs") / f"{job_id}_{safe}.txt"
              result   = subprocess.run(
                  ["gh", "api", f"/repos/{repo}/actions/jobs/{job_id}/logs"],
                  capture_output=True,
                  env={**os.environ},
              )
              if result.returncode == 0 and result.stdout:
                  out_path.write_bytes(result.stdout)
                  print(f"  saved: {out_path.name} ({len(result.stdout)} bytes)")
              else:
                  print(f"  WARN: no log for job {job_id} ({job_name}): {result.stderr.decode()[:200]}")
          PYEOF

          echo "Log files downloaded:"
          ls -lh raw_logs/ || echo "(none)"

      # ---------------------------------------------------------------------------
      # Run parse_module_test_logs.py against the downloaded .txt files.
      # The script expects files matching:
      #   *_run-tests _ Spyre model-module tests*.txt
      # The job name from GHA is "Spyre model-module tests (<config>)", which
      # after sanitisation becomes "<id>_Spyre_model-module_tests_(<config>).txt"
      # -- close enough for the yaml-stem extraction regex inside the script.
      # We pass tests/configs/module_tests as the yaml-config-dir so forward_inputs
      # are back-filled for OOT test_forward records.
      # ---------------------------------------------------------------------------
      - name: Parse module-test logs → JSON
        if: steps.download-logs.outputs.job_count != '0'
        run: |
          source .venv/bin/activate
          python3 .github/scripts/parse_module_test_logs.py \
            raw_logs \
            --output "module_tests_${TRIGGERING_RUN_ID}.json"
          echo "Produced module_tests_${TRIGGERING_RUN_ID}.json"
          cat "module_tests_${TRIGGERING_RUN_ID}.json" | python3 -c \
            "import json,sys; d=json.load(sys.stdin); print(f'  {len(d)} suite record(s)')"

      # ---------------------------------------------------------------------------
      # Ingest the JSON into ClickHouse: module_test_suites + module_test_variants
      # ---------------------------------------------------------------------------
      - name: Ingest JSON → ClickHouse
        if: steps.download-logs.outputs.job_count != '0'
        run: |
          source .venv/bin/activate
          python3 .github/scripts/ingest_module_tests.py \
            --json-file "module_tests_${TRIGGERING_RUN_ID}.json" \
            --workflow  "${TRIGGERING_WORKFLOW:-test_daily}" \
            --branch    "${TRIGGERING_BRANCH}" \
            --sha       "${TRIGGERING_SHA}" \
            --run-id    "${TRIGGERING_RUN_ID}"

      - name: Module-log ingest summary
        if: always()
        run: |
          JOB_COUNT="${{ steps.download-logs.outputs.job_count || '0' }}"
          {
            echo "### Module-Test Log Ingest Summary"
            echo "| Key | Value |"
            echo "|---|---|"
            echo "| Triggering workflow | ${TRIGGERING_WORKFLOW:-test_daily} |"
            echo "| Triggering run ID   | ${TRIGGERING_RUN_ID} |"
            echo "| Branch              | ${TRIGGERING_BRANCH} |"
            echo "| Commit SHA          | ${TRIGGERING_SHA:0:12} |"
            echo "| Module-test jobs    | ${JOB_COUNT} |"
          } >> "$GITHUB_STEP_SUMMARY"
