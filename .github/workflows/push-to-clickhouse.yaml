# =============================================================================
# Weekly Spyre model-support scan -> ClickHouse
#
# Runs the top-K HuggingFace Hub generative and embedding models through the
# CPU-load -> Spyre-verify pipeline (tests/spyre/weekly_generation/weekly_test.py)
# and records the outcome directly in ClickHouse (see result_sink.py), replacing
# the manual dev-instance upload + periodic dev->prod migration.
#
# Unlike torch-spyre's push-to-clickhouse.yaml, this is not a post-hoc ingest
# of a separate test run's artifact: the scan reads and writes ClickHouse
# directly.
#
# At top_k=10000 per mode, a single job processing the whole list serially
# would take far too long, so the fetch itself IS split out: generate-matrix
# fetches the top-K list once (no Spyre hardware needed), shards it, and
# weekly-model-scan fans out over those shards in parallel (mirrors
# torch-spyre's generate_matrix -> matrix job pattern).
#
# generate-matrix also does all the FILTERING, which is why it needs ClickHouse
# credentials of its own: it applies the no-adapter / too-large / MoE checks and
# writes those terminal verdict rows itself. weekly_test.py used to do this
# inside each shard, but the dropped models cluster — config-class families
# cluster by download count — so surviving counts per shard varied wildly and
# some jobs finished in minutes while others ran for hours. Filtering before
# chunking makes shard size a count of real evaluations.
#
# Every model that survives the filter is evaluated: there is no "recently
# scanned" check, so a re-run repeats the full scan rather than resuming a
# partial one. If a run is cancelled after generate-matrix succeeds
# (cancel-in-progress below makes that routine), the terminal verdict rows it
# already wrote stay — they are terminal properties of the checkpoint, so a
# re-run simply overwrites them with the same values.
# =============================================================================
name: push-to-clickhouse

on:
  schedule:
    # Saturday 22:00 UTC
    - cron: "0 22 * * 6"
  workflow_dispatch:
    inputs:
      top_k:
        description: Number of top models to fetch (by downloads)
        required: false
        type: string
        default: "10000"
      model_type:
        description: >-
          Model type to scan
        required: false
        type: choice
        options:
          - all
          - generative
          - embedding
        default: all
      snapshot_date:
        description: >-
          Snapshot date (YYYY-MM-DD). Defaults to today.
        required: false
        type: string
        default: ""
      clickhouse_db:
        description: >-
          Which ClickHouse instance to write to: dev or prod.
        required: false
        type: choice
        options:
          - dev
          - prod
        default: dev

concurrency:
  # Scoped per-ref: a new commit on a given branch cancels and supersedes
  # whatever's still running for that SAME branch, without touching a run
  # in progress on a different ref (e.g. a PR-branch test push won't cancel
  # the real production scan running against main).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: /home/senuser

env:
  # See test_daily.yaml for why CI must be blanked out here.
  CI: ""
  CLONED_HF_ADAPTERS_DIR: ${{ github.workspace }}
  STORAGE_1_DIR: /storage-1/hf-adapters
  HF_HOME: /storage-1/hf-adapters/.cache/huggingface

  # ---------------------------------------------------------------------------
  # ClickHouse target selection, resolved ONCE here and inherited by every job
  # (generate-matrix + all three scan tiers) — workflow-level env supports both
  # `secrets` and expressions, so the five variables don't need repeating
  # per-job. Jobs must NOT redeclare CLICKHOUSE_* in their own `env:`, since a
  # job-level key of the same name shadows the workflow-level one.
  #
  # Selection rule: prod unless this is a manual dispatch that asked for dev.
  # Written in that direction deliberately — the `inputs` context is empty for
  # schedule-triggered runs (the input schema's `default: dev` only applies to
  # the manual "Run workflow" form), so the scheduled weekly scan falls through
  # to prod, while a manual run defaults to dev and must opt in to prod.
  # ---------------------------------------------------------------------------
  CLICKHOUSE_TARGET: ${{ (github.event_name == 'workflow_dispatch' && inputs.clickhouse_db == 'dev') && 'dev' || 'prod' }}
  CLICKHOUSE_HOST: ${{ (github.event_name == 'workflow_dispatch' && inputs.clickhouse_db == 'dev') && secrets.CLICKHOUSE_HOST_DEV || secrets.CLICKHOUSE_HOST }}
  CLICKHOUSE_PORT: ${{ (github.event_name == 'workflow_dispatch' && inputs.clickhouse_db == 'dev') && secrets.CLICKHOUSE_PORT_DEV || secrets.CLICKHOUSE_PORT }}
  CLICKHOUSE_USER: ${{ (github.event_name == 'workflow_dispatch' && inputs.clickhouse_db == 'dev') && secrets.CLICKHOUSE_USER_DEV || secrets.CLICKHOUSE_USER }}
  CLICKHOUSE_PASS: ${{ (github.event_name == 'workflow_dispatch' && inputs.clickhouse_db == 'dev') && secrets.CLICKHOUSE_PASS_DEV || secrets.CLICKHOUSE_PASS }}
  CLICKHOUSE_DB: ${{ (github.event_name == 'workflow_dispatch' && inputs.clickhouse_db == 'dev') && secrets.CLICKHOUSE_DB_DEV || secrets.CLICKHOUSE_DB }}

jobs:
  # ---------------------------------------------------------------------------
  # Fetch the top-K list once per mode, filter it, and shard the survivors for
  # the parallel matrix job below. No Spyre hardware is needed because the
  # catalog path uses Hugging Face metadata only.
  #
  # This job DOES need ClickHouse: it writes the terminal verdict rows for
  # everything it filters out. See the header comment.
  # ---------------------------------------------------------------------------
  generate-matrix:
    name: Generate weekly shards
    runs-on:
      - x86_64
      - spyre_pf_x0
      - linux
      - image_spyre_backend
    # At top_k=10000+, fetching 2x oversampled raw candidates per mode (each
    # requiring a has_loadable_weights/contains_remote_code network call) is
    # genuinely slow — 30 min wasn't enough and the job was cancelled mid-run.
    timeout-minutes: 120
    # Overrides the workflow-level default of /home/senuser (test_daily.yaml's
    # own generate-matrix job does the same) — that path only exists on the
    # Spyre-pod runner image, not on ubuntu-latest.
    defaults:
      run:
        working-directory: .
    outputs:
      matrix_x1: ${{ steps.generate.outputs.matrix_x1 }}
      matrix_x2: ${{ steps.generate.outputs.matrix_x2 }}
      matrix_x4: ${{ steps.generate.outputs.matrix_x4 }}
      snapshot_date: ${{ steps.generate.outputs.snapshot_date }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # CLICKHOUSE_* are inherited from the workflow-level env block. This job
      # needs them because it writes the terminal verdict rows for the models it
      # filters out.
      #
      # Overrides the workflow-level HF_HOME (/storage-1/... — a Spyre-pod-only
      # mount). Every AutoConfig.from_pretrained() call was failing with a
      # PermissionError trying to write there, which contains_remote_code()
      # silently caught and treated as "yes, remote code" — filtering out
      # every single model regardless of top_k.
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check Python
        run: |
          which python3
          python3 --version
          python3 -m pip --version

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: setup venv
        run: |
          uv venv
          source .venv/bin/activate
          echo "VIRTUAL_ENV $VIRTUAL_ENV"

      - name: Install Python dependencies
        run: |
          source .venv/bin/activate
          uv pip install huggingface_hub tqdm transformers clickhouse-connect python-dotenv
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu

      # TEMPORARY debug step: confirms HF_TOKEN actually reaches this job as a
      # working credential, and re-runs the real keep()-filter checks against
      # one known-public model WITHOUT swallowing exceptions, since
      # has_loadable_weights()/contains_remote_code() both catch everything
      # and return a plain bool by design. Never prints the token itself.
      # Remove once the 0-kept-models issue is root-caused.
      - name: Verify HF Hub authentication
        run: |
          source .venv/bin/activate
          python -m pip freeze | grep -iE "^(huggingface-hub|transformers)==" || true
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          from transformers import AutoConfig

          tok = os.environ.get("HF_TOKEN") or ""
          print(f"HF_TOKEN: {'set (' + str(len(tok)) + ' chars)' if tok else 'NOT SET / empty'}")
          token = tok or False

          try:
              info = HfApi(token=token).whoami()
              print(f"whoami() OK: {info.get('name', info)!r}")
          except Exception as e:
              print(f"whoami() FAILED: {type(e).__name__}: {e}")

          probe_id = "openai-community/gpt2"
          print(f"\n--- probing keep()-equivalent checks against {probe_id!r} ---")

          try:
              files = HfApi(token=token).list_repo_files(probe_id, token=token)
              print(f"list_repo_files() OK: {len(files)} files, e.g. {files[:5]}")
          except Exception as e:
              print(f"list_repo_files() FAILED: {type(e).__name__}: {e}")

          try:
              cfg = AutoConfig.from_pretrained(probe_id, trust_remote_code=False)
              print(f"AutoConfig.from_pretrained() OK: {type(cfg).__name__}")
          except Exception as e:
              print(f"AutoConfig.from_pretrained() FAILED: {type(e).__name__}: {e}")
          PY

      # Fail fast if ClickHouse secrets are missing/wrong: this job now writes the
      # terminal verdict rows, and the fetch below can take 90+ minutes before it
      # would otherwise reach the sink. Never prints
      # secret values, only presence/length and a live SELECT 1. Same check the
      # scan jobs run, minus their `cd`/`uv run` wrapper — this job uses plain
      # python with working-directory: '.'.
      - name: Verify ClickHouse connection
        run: |
          source .venv/bin/activate
          echo "ClickHouse target: $CLICKHOUSE_TARGET"
          MISSING=0
          for VAR in CLICKHOUSE_HOST CLICKHOUSE_PORT CLICKHOUSE_USER CLICKHOUSE_PASS CLICKHOUSE_DB; do
            VAL="${!VAR}"
            if [[ -n "$VAL" ]]; then
              echo "$VAR: set (${#VAL} chars)"
            else
              echo "$VAR: NOT SET"
              MISSING=1
            fi
          done
          # A `dev` run whose *_DEV secret is empty would NOT fail here: GitHub's
          # `cond && secrets.X_DEV || secrets.X` is value-returning, not boolean,
          # so an empty/missing _DEV secret silently falls through to the PROD
          # value — i.e. a run asked to target dev would write to production, and
          # the length check above would look perfectly healthy. Fail loudly
          # instead of clobbering prod.
          if [[ "$CLICKHOUSE_TARGET" == "dev" && "$MISSING" == "1" ]]; then
            echo "::error::CLICKHOUSE_TARGET=dev but a CLICKHOUSE_*_DEV secret is missing;" \
                 "refusing to run rather than risk falling back to the prod instance."
            exit 1
          fi
          python - <<'PY'
          import os
          import clickhouse_connect

          client = clickhouse_connect.get_client(
              host=os.environ["CLICKHOUSE_HOST"],
              port=int(os.environ.get("CLICKHOUSE_PORT", 443)),
              user=os.environ.get("CLICKHOUSE_USER", "default"),
              password=os.environ["CLICKHOUSE_PASS"],
              database=os.environ.get("CLICKHOUSE_DB", "spyre"),
              secure=True,
          )
          client.command("SELECT 1")
          print("ClickHouse connectivity check: OK")
          PY

      - name: Generate shards
        id: generate
        run: |
          # '10000' / 'all' are the fallbacks for schedule-triggered runs,
          # since the `inputs` context is only populated for
          # workflow_dispatch (the input schema's defaults above only apply
          # to the manual "Run workflow" form). The scheduled run must always
          # scan 'all' regardless of what a prior manual dispatch selected.
          #
          # Shard sizes use the script's real defaults (250/500 for the
          # x1 tier, 100/50 for the x2/x4 tiers by parameter count).
          #
          # snapshot_date is computed once here and forwarded to every scan
          # job via the generate-matrix output, so a run straddling midnight
          # records a consistent date across all shards and their terminal rows.
          source .venv/bin/activate
          SNAPSHOT_DATE="${{ inputs.snapshot_date || '' }}"
          if [[ -z "$SNAPSHOT_DATE" ]]; then
            SNAPSHOT_DATE=$(date -u +%Y-%m-%d)
          fi
          echo "snapshot_date=$SNAPSHOT_DATE" >> "$GITHUB_OUTPUT"
          python .github/scripts/generate_weekly_shards.py \
            --top-k ${{ inputs.top_k || '10000' }} \
            --model-type ${{ github.event_name == 'workflow_dispatch' && (inputs.model_type || 'all') || 'all' }} \
            --snapshot-date "$SNAPSHOT_DATE" \
            --output-dir shards

      - name: Upload shard artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weekly-shards
          path: shards/
          retention-days: 7

  # Split by runner tier so max-parallel caps total cards held at once. The cap
  # depends on who dispatched the run:
  #   - manual workflow_dispatch shares the fleet with PR/daily CI, so it stays
  #     small: 10*1 + 2*2 + 1*4 = 18 cards (~2 nodes).
  #   - the scheduled weekly scan (Saturday 22:00) effectively owns the fleet, so
  #     it spreads wider to finish sooner: 25*1 + 10*2 + 4*4 = 61 cards.
  #
  # The three expressions are repeated inline rather than hoisted into one place.
  # `env` can't be used: jobs.<job_id>.strategy only accepts the github/needs/
  # vars/inputs contexts. Routing them through generate-matrix `outputs` does
  # parse, but job outputs are always strings and max-parallel wants a number —
  # actionlint rejects it, and an unparsed max-parallel means *unlimited*
  # parallelism, which is the one failure mode worth avoiding here.
  #
  # The `if` guards an empty matrix: now that generate-matrix filters before
  # chunking, a tier can legitimately produce zero shards — no fetched model
  # falls in its parameter range, or a --model-type run skipped it entirely.
  # This showed up in testing as matrix_x4=[].
  weekly-model-scan-x1:
    name: Weekly model scan x1 (${{ matrix.mode }} shard ${{ matrix.shard_index }})
    needs: generate-matrix
    if: needs.generate-matrix.outputs.matrix_x1 != '[]'
    runs-on: [x86_64, spyre_pf_x1, linux, image_torch_spyre]
    timeout-minutes: 4320
    strategy:
      fail-fast: false
      max-parallel: ${{ github.event_name == 'workflow_dispatch' && 10 || 25 }}
      matrix:
        include: ${{ fromJSON(needs.generate-matrix.outputs.matrix_x1) }}
    env:
      # CLICKHOUSE_* are inherited from the workflow-level env block.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout composite actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/gather-runner-info
        with:
          verbose: 'true'

      - uses: ./.github/actions/build-hf-adapters
        with:
          uv_groups: "dev spyre test models-ops"

      - name: Download shard
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: weekly-shards
          path: shards

      # Fail fast if ClickHouse secrets are missing/wrong. Never prints
      # secret values, only presence/length and a live SELECT 1.
      - name: Verify ClickHouse connection
        run: |
          echo "ClickHouse target: $CLICKHOUSE_TARGET"
          MISSING=0
          for VAR in CLICKHOUSE_HOST CLICKHOUSE_PORT CLICKHOUSE_USER CLICKHOUSE_PASS CLICKHOUSE_DB; do
            VAL="${!VAR}"
            if [[ -n "$VAL" ]]; then
              echo "$VAR: set (${#VAL} chars)"
            else
              echo "$VAR: NOT SET"
              MISSING=1
            fi
          done
          # A `dev` run whose *_DEV secret is empty would NOT fail here: GitHub's
          # `cond && secrets.X_DEV || secrets.X` is value-returning, not boolean,
          # so an empty/missing _DEV secret silently falls through to the PROD
          # value — i.e. a run asked to target dev would write to production, and
          # the length check above would look perfectly healthy. Fail loudly
          # instead of clobbering prod.
          if [[ "$CLICKHOUSE_TARGET" == "dev" && "$MISSING" == "1" ]]; then
            echo "::error::CLICKHOUSE_TARGET=dev but a CLICKHOUSE_*_DEV secret is missing;" \
                 "refusing to run rather than risk falling back to the prod instance."
            exit 1
          fi
          cd "$CLONED_HF_ADAPTERS_DIR"
          uv run python - <<'PY'
          import os
          import clickhouse_connect

          client = clickhouse_connect.get_client(
              host=os.environ["CLICKHOUSE_HOST"],
              port=int(os.environ.get("CLICKHOUSE_PORT", 443)),
              user=os.environ.get("CLICKHOUSE_USER", "default"),
              password=os.environ["CLICKHOUSE_PASS"],
              database=os.environ.get("CLICKHOUSE_DB", "spyre"),
              secure=True,
          )
          client.command("SELECT 1")
          print("ClickHouse connectivity check: OK")
          PY

      - name: Run weekly ${{ matrix.mode }} model scan (shard ${{ matrix.shard_index }})
        run: |
          source "$HOME/.bashrc"
          source /etc/profile.d/ibm-aiu-setup.sh
          cd "$CLONED_HF_ADAPTERS_DIR"
          uv run python tests/spyre/weekly_generation/weekly_test.py \
            --mode ${{ matrix.mode }} \
            --model-list-file shards/${{ matrix.shard_file }} \
            --snapshot-date ${{ needs.generate-matrix.outputs.snapshot_date }}
          echo "weekly ${{ matrix.mode }} shard ${{ matrix.shard_index }} scan done"

  weekly-model-scan-x2:
    name: Weekly model scan x2 (${{ matrix.mode }} shard ${{ matrix.shard_index }})
    needs: generate-matrix
    if: needs.generate-matrix.outputs.matrix_x2 != '[]'
    runs-on: [x86_64, spyre_pf_x2, linux, image_torch_spyre]
    timeout-minutes: 4320
    strategy:
      fail-fast: false
      max-parallel: ${{ github.event_name == 'workflow_dispatch' && 2 || 10 }}
      matrix:
        include: ${{ fromJSON(needs.generate-matrix.outputs.matrix_x2) }}
    env:
      # CLICKHOUSE_* are inherited from the workflow-level env block.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout composite actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/gather-runner-info
        with:
          verbose: 'true'

      - uses: ./.github/actions/build-hf-adapters
        with:
          uv_groups: "dev spyre test models-ops"

      - name: Download shard
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: weekly-shards
          path: shards

      # Fail fast if ClickHouse secrets are missing/wrong. Never prints
      # secret values, only presence/length and a live SELECT 1.
      - name: Verify ClickHouse connection
        run: |
          echo "ClickHouse target: $CLICKHOUSE_TARGET"
          MISSING=0
          for VAR in CLICKHOUSE_HOST CLICKHOUSE_PORT CLICKHOUSE_USER CLICKHOUSE_PASS CLICKHOUSE_DB; do
            VAL="${!VAR}"
            if [[ -n "$VAL" ]]; then
              echo "$VAR: set (${#VAL} chars)"
            else
              echo "$VAR: NOT SET"
              MISSING=1
            fi
          done
          # A `dev` run whose *_DEV secret is empty would NOT fail here: GitHub's
          # `cond && secrets.X_DEV || secrets.X` is value-returning, not boolean,
          # so an empty/missing _DEV secret silently falls through to the PROD
          # value — i.e. a run asked to target dev would write to production, and
          # the length check above would look perfectly healthy. Fail loudly
          # instead of clobbering prod.
          if [[ "$CLICKHOUSE_TARGET" == "dev" && "$MISSING" == "1" ]]; then
            echo "::error::CLICKHOUSE_TARGET=dev but a CLICKHOUSE_*_DEV secret is missing;" \
                 "refusing to run rather than risk falling back to the prod instance."
            exit 1
          fi
          cd "$CLONED_HF_ADAPTERS_DIR"
          uv run python - <<'PY'
          import os
          import clickhouse_connect

          client = clickhouse_connect.get_client(
              host=os.environ["CLICKHOUSE_HOST"],
              port=int(os.environ.get("CLICKHOUSE_PORT", 443)),
              user=os.environ.get("CLICKHOUSE_USER", "default"),
              password=os.environ["CLICKHOUSE_PASS"],
              database=os.environ.get("CLICKHOUSE_DB", "spyre"),
              secure=True,
          )
          client.command("SELECT 1")
          print("ClickHouse connectivity check: OK")
          PY

      - name: Run weekly ${{ matrix.mode }} model scan (shard ${{ matrix.shard_index }})
        run: |
          source "$HOME/.bashrc"
          source /etc/profile.d/ibm-aiu-setup.sh
          cd "$CLONED_HF_ADAPTERS_DIR"
          uv run python tests/spyre/weekly_generation/weekly_test.py \
            --mode ${{ matrix.mode }} \
            --model-list-file shards/${{ matrix.shard_file }} \
            --snapshot-date ${{ needs.generate-matrix.outputs.snapshot_date }}
          echo "weekly ${{ matrix.mode }} shard ${{ matrix.shard_index }} scan done"

  weekly-model-scan-x4:
    name: Weekly model scan x4 (${{ matrix.mode }} shard ${{ matrix.shard_index }})
    needs: generate-matrix
    if: needs.generate-matrix.outputs.matrix_x4 != '[]'
    runs-on: [x86_64, spyre_pf_x4, linux, image_torch_spyre]
    timeout-minutes: 4320
    strategy:
      fail-fast: false
      max-parallel: ${{ github.event_name == 'workflow_dispatch' && 1 || 4 }}
      matrix:
        include: ${{ fromJSON(needs.generate-matrix.outputs.matrix_x4) }}
    env:
      # CLICKHOUSE_* are inherited from the workflow-level env block.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout composite actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/gather-runner-info
        with:
          verbose: 'true'

      - uses: ./.github/actions/build-hf-adapters
        with:
          uv_groups: "dev spyre test models-ops"

      - name: Download shard
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: weekly-shards
          path: shards

      # Fail fast if ClickHouse secrets are missing/wrong. Never prints
      # secret values, only presence/length and a live SELECT 1.
      - name: Verify ClickHouse connection
        run: |
          echo "ClickHouse target: $CLICKHOUSE_TARGET"
          MISSING=0
          for VAR in CLICKHOUSE_HOST CLICKHOUSE_PORT CLICKHOUSE_USER CLICKHOUSE_PASS CLICKHOUSE_DB; do
            VAL="${!VAR}"
            if [[ -n "$VAL" ]]; then
              echo "$VAR: set (${#VAL} chars)"
            else
              echo "$VAR: NOT SET"
              MISSING=1
            fi
          done
          # A `dev` run whose *_DEV secret is empty would NOT fail here: GitHub's
          # `cond && secrets.X_DEV || secrets.X` is value-returning, not boolean,
          # so an empty/missing _DEV secret silently falls through to the PROD
          # value — i.e. a run asked to target dev would write to production, and
          # the length check above would look perfectly healthy. Fail loudly
          # instead of clobbering prod.
          if [[ "$CLICKHOUSE_TARGET" == "dev" && "$MISSING" == "1" ]]; then
            echo "::error::CLICKHOUSE_TARGET=dev but a CLICKHOUSE_*_DEV secret is missing;" \
                 "refusing to run rather than risk falling back to the prod instance."
            exit 1
          fi
          cd "$CLONED_HF_ADAPTERS_DIR"
          uv run python - <<'PY'
          import os
          import clickhouse_connect

          client = clickhouse_connect.get_client(
              host=os.environ["CLICKHOUSE_HOST"],
              port=int(os.environ.get("CLICKHOUSE_PORT", 443)),
              user=os.environ.get("CLICKHOUSE_USER", "default"),
              password=os.environ["CLICKHOUSE_PASS"],
              database=os.environ.get("CLICKHOUSE_DB", "spyre"),
              secure=True,
          )
          client.command("SELECT 1")
          print("ClickHouse connectivity check: OK")
          PY

      - name: Run weekly ${{ matrix.mode }} model scan (shard ${{ matrix.shard_index }})
        run: |
          source "$HOME/.bashrc"
          source /etc/profile.d/ibm-aiu-setup.sh
          cd "$CLONED_HF_ADAPTERS_DIR"
          uv run python tests/spyre/weekly_generation/weekly_test.py \
            --mode ${{ matrix.mode }} \
            --model-list-file shards/${{ matrix.shard_file }} \
            --snapshot-date ${{ needs.generate-matrix.outputs.snapshot_date }}
          echo "weekly ${{ matrix.mode }} shard ${{ matrix.shard_index }} scan done"
