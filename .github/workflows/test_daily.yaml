name: test_daily

# ---------------------------------------------------------------------------
# Daily edge-case sweep. Delegates entirely to _test_matrix.yaml with
# test_type: edge_cases, which fans out the tests/spyre/edge_cases/ suite
# (9 files x every causal-LM model) on the standing image_torch_spyre set.
#
# Only the edge_cases suite runs -- pre-commit/mypy/check-uv-lock and the
# other spyre-*-tests suites either skip or don't apply (their `if:` gates
# require test_type in regression/trunk/unit or a matching suite-key word).
# ---------------------------------------------------------------------------
on:
  schedule:
    # Runs at 06:00 UTC every day.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA of hf-adapters to check out and test
        required: false
        type: string
        default: ""
      repository:
        description: |
          Full clone URL of the hf-adapters fork to check out (e.g.
          "https://github.com/myuser/hf-adapters.git"); leave empty for the base repo.
        required: false
        type: string
        default: ""
      runner_label:
        description: |
          Per-PR ephemeral runner-set IMAGE label to select for runs-on.
          Empty keeps the run on the standing image_torch_spyre set.
        required: false
        type: string
        default: ""
      models:
        description: >-
          Space-separated list of model paths to restrict edge-case jobs to.
          Must match paths exactly as they appear in tests/model_registry.py.
          Empty (default) = run every causal-LM model in the registry.
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  run-tests:
    uses: ./.github/workflows/_test_matrix.yaml
    with:
      image_label: ${{ inputs.runner_label || 'image_torch_spyre' }}
      extra_test_flags: -vvv -s
      extra_test_flags_multi_spyre: -vvv -s
      ref: ${{ inputs.ref || '' }}
      repository: ${{ inputs.repository || '' }}
      test_type: edge_cases
      models: ${{ inputs.models || '' }}

  # ----------------------------------------------------------------------------------
  # Required check gate -- fans in the delegated suite run so a single
  # stable job name reports pass/fail.
  # ----------------------------------------------------------------------------------
  daily-test-result:
    name: Daily test result
    runs-on: ubuntu-latest
    needs: run-tests
    if: always()
    steps:
      - name: Evaluate test results
        run: |
          RESULT="${{ needs.run-tests.result }}"
          echo "run-tests result: ${RESULT}"
          if [[ "${RESULT}" == "success" ]]; then
            echo "Daily edge-case suite passed."
            exit 0
          fi
          echo "Daily edge-case suite failed or was cancelled."
          exit 1
