name: test_daily

# ---------------------------------------------------------------------------
# Daily sweep. Runs two independent legs via _test_matrix.yaml:
#   1. edge-cases  — test_type: regression, edge_cases_only: true
#                    (tests/spyre/edge_cases/ only)
#   2. module-tests — test_type: model_module, edge_cases_only: false (default)
#                    (spyre-model-module-tests, one leg per
#                     tests/configs/module_tests/*.yaml)
#
# Module-test results are ingested into ClickHouse by the ingest-module-logs
# job in push-test-results-to-clickhouse.yaml, which fires on test_daily
# completion via workflow_run.
# ---------------------------------------------------------------------------
on:
  schedule:
    # Runs at 06:00 UTC every day.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA of hf-adapters to check out and test
        required: false
        type: string
        default: ""
      repository:
        description: |
          Full clone URL of the hf-adapters fork to check out (e.g.
          "https://github.com/myuser/hf-adapters.git"); leave empty for the base repo.
        required: false
        type: string
        default: ""
      runner_label:
        description: |
          Per-PR ephemeral runner-set IMAGE label to select for runs-on.
          Empty keeps the run on the standing image_torch_spyre set.
        required: false
        type: string
        default: ""
      models:
        description: >-
          Space-separated list of model paths to restrict edge-case jobs to.
          Must match paths exactly as they appear in tests/model_registry.py.
          Empty (default) = run every causal-LM model in the registry.
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  # actions: read is required by _test_matrix.yaml's collect-failed-suites job to list/download failed-suite-* artifacts via the REST API; reusable workflows can only narrow the caller's permissions, so this must be granted here too.
  actions: read

jobs:
  # ---------------------------------------------------------------------------
  # Leg 1: edge-case tests (unchanged behaviour)
  # ---------------------------------------------------------------------------
  run-tests:
    uses: ./.github/workflows/_test_matrix.yaml
    with:
      image_label: ${{ inputs.runner_label || 'image_torch_spyre' }}
      extra_test_flags: -vvv -s
      extra_test_flags_multi_spyre: -vvv -s
      ref: ${{ inputs.ref || '' }}
      repository: ${{ inputs.repository || '' }}
      test_type: regression
      edge_cases_only: true
      models: ${{ inputs.models || '' }}

  # ---------------------------------------------------------------------------
  # Leg 2: module tests — runs independently of edge-cases so a failure in
  # one leg does not cancel the other.
  # edge_cases_only is omitted (defaults false) so the module-test jobs are
  # not suppressed by the edge-cases guard in _test_matrix.yaml.
  # ---------------------------------------------------------------------------
  run-module-tests:
    uses: ./.github/workflows/_test_matrix.yaml
    with:
      image_label: ${{ inputs.runner_label || 'image_torch_spyre' }}
      extra_test_flags: -vvv -s
      extra_test_flags_multi_spyre: -vvv -s
      ref: ${{ inputs.ref || '' }}
      repository: ${{ inputs.repository || '' }}
      test_type: model_module
      models: ${{ inputs.models || '' }}

  # ---------------------------------------------------------------------------
  # Fan-in gate: single stable job name for pass/fail polling.
  # Waits for both legs; fails if either failed or was cancelled.
  # ---------------------------------------------------------------------------
  daily-test-result:
    name: Daily test result
    runs-on: ubuntu-latest
    needs: [run-tests, run-module-tests]
    if: always()
    steps:
      - name: Evaluate test results
        run: |
          EDGE="${{ needs.run-tests.result }}"
          MODULE="${{ needs.run-module-tests.result }}"
          echo "edge-cases result:  ${EDGE}"
          echo "module-tests result: ${MODULE}"
          if [[ "${EDGE}" == "success" && "${MODULE}" == "success" ]]; then
            echo "Daily suite passed (edge-cases + module-tests)."
            exit 0
          fi
          echo "Daily suite failed or was cancelled."
          exit 1
