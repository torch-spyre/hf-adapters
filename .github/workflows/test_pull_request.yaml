name: test_pull_request

# Doubles as hf-adapters' "trunk" (push-to-main) workflow -- on push this
# still runs every job unconditionally (job-selection for trunk == full,
# which is already this workflow's only mode), so the run-name below is
# purely a labeling change. Delegates its suite jobs to the same reusable
# _test_matrix.yaml used by integration-tests.yaml.
run-name: ${{ github.event_name == 'push' && 'trunk' || 'regression' }}

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      torch_spyre_ref:
        description: >-
          Accepted for dispatch-contract parity with torch-spyre; unused
          here (build-hf-adapters does not consume it).
        required: false
        type: string
        default: ""
      rpm_location:
        description: >-
          Accepted for dispatch-contract parity with torch-spyre; unused
          here (build-hf-adapters does not consume it).
        required: false
        type: string
        default: ""
      rpm_names:
        description: >-
          Accepted for dispatch-contract parity with torch-spyre; unused
          here (build-hf-adapters does not consume it).
        required: false
        type: string
        default: ""
      ref:
        description: Branch, tag, or SHA of hf-adapters to check out and test
        required: false
        type: string
        default: ""
      repository:
        description: |
          Full clone URL of the hf-adapters fork to check out (e.g.
          "https://github.com/myuser/hf-adapters.git"); leave empty for the base repo.
          Used by the cross-repo Test-With: flow to test a companion fork/branch.
        required: false
        type: string
        default: ""
      pr_url_hash:
        description: |
          Hash of the full URL of the PR that triggered this run.
          Sent by the internal integration pipeline; unused on push/PR.
        required: false
        type: string
        default: ""
      build_torch_spyre:
        description: Accepted for dispatch-contract parity with torch-spyre; unused here.
        required: false
        type: boolean
        default: true
      runner_label:
        description: |
          Per-PR ephemeral runner-set IMAGE label to select for runs-on
          (image_hf_adapters_pr_<component>_<sha12>, e.g.
          image_hf_adapters_pr_flex_8ddcf3e155e9). The per-PR ephemeral flow passes
          that PR's set label so jobs land on the per-PR image (the changed RPM is
          baked in -> no runtime sudo). Empty keeps push/PR runs on the
          standing image_torch_spyre set (today's behaviour).
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  # actions: read is required by _test_matrix.yaml's collect-failed-suites job to list/download failed-suite-* artifacts via the REST API; reusable workflows can only narrow the caller's permissions, so this must be granted here too.
  actions: read

jobs:
  # ---------------------------------------------------------------------------
  # Delegates to the shared _test_matrix.yaml (pre-commit, mypy, check-uv-lock,
  # adapter-coverage, matrix generation, and every spyre-*-tests /
  # spyre-model-module-tests suite). test_type is left at its default
  # ("regression" -- everything), matching this workflow's historical
  # behavior of always running the full suite.
  # ---------------------------------------------------------------------------
  run-tests:
    # Skip entirely once auto_merge is enabled on the PR -- native GHA checks aren't required there; run-spyre-unit-tests below still reports green since "skipped" isn't a failure.
    # Repo variable GHA_TESTS_ON_AUTO_MERGE=true keeps the suite running on auto-merge PRs too.
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.auto_merge != null && vars.GHA_TESTS_ON_AUTO_MERGE != 'true') }}
    uses: ./.github/workflows/_test_matrix.yaml
    # Reusable workflows get no secrets unless passed; without this HF_TOKEN resolves to "" in every test job.
    secrets: inherit
    with:
      # Per-PR ephemeral image label when provided, else the standing set for this event.
      image_label: ${{ inputs.runner_label || 'image_torch_spyre' }}
      extra_test_flags: -vvv -s
      extra_test_flags_multi_spyre: -vvv -s
      ref: ${{ inputs.ref || '' }}
      repository: ${{ inputs.repository || '' }}

  # ----------------------------------------------------------------------------------
  # Required check gate -- wraps the delegated suite run so a single branch
  # protection rule ("tests / run spyre unit tests") tracks one stable job name.
  # ----------------------------------------------------------------------------------
  run-spyre-unit-tests:
    name: run spyre unit tests
    runs-on: ubuntu-latest
    needs: [run-tests]
    if: always()
    steps:
      - name: Check all suites passed
        run: |-
          if ${{ contains(needs.run-tests.result, 'failure') || contains(needs.run-tests.result, 'cancelled') }}; then
            echo "One or more test suites failed."
            exit 1
          fi
          echo "All test suites passed."

  # Reads the variables once, so the gate's name and steps below cannot disagree if they are flipped mid-run.
  decide-spyre-test:
    name: Decide whether GHA owns the check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      owns: ${{ steps.v.outputs.owns }}
    steps:
      - id: v
        env:
          OWNS: ${{ vars.GHA_FULL_MERGE_QUEUE_TESTS == 'true' && github.event_name == 'pull_request' && (github.event.pull_request.auto_merge == null || vars.GHA_TESTS_ON_AUTO_MERGE == 'true') }}
        run: echo "owns=${OWNS}" >> "$GITHUB_OUTPUT"

  # Posts the required "Spyre Test (amd64)" context on PRs where GHA ran the suite and owns the
  # check; the name only matches then, so a skipped run can never satisfy it.
  spyre-test-amd64:
    name: ${{ needs.decide-spyre-test.outputs.owns == 'true' && 'Spyre Test (amd64)' || 'gha-pr-spyre-test (inactive)' }}
    runs-on: ubuntu-latest
    needs: [decide-spyre-test, run-tests]
    if: always() && github.event_name == 'pull_request'
    steps:
      # Fork PR runs cannot read repo variables, so the owns decision above is false for them. spyre_test_status.yaml
      # runs in the base repo, applies the variables there and posts the PR-head status from this verdict.
      - name: Record the suite verdict
        if: always()
        continue-on-error: true
        env:
          RUN_TESTS: ${{ needs.run-tests.result }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          case "$RUN_TESTS" in
            success) verdict=success ;;
            skipped) verdict=skipped ;;
            *) verdict=failure ;;
          esac
          echo "verdict=${verdict}"
          printf '%s %s' "$verdict" "$ATTEMPT" > verdict.txt
      - name: Upload the suite verdict
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spyre-test-verdict
          path: verdict.txt
          retention-days: 1
          overwrite: true
      - name: GHA does not own this check here
        if: ${{ needs.decide-spyre-test.outputs.owns != 'true' }}
        run: echo "Jenkins owns the Spyre Test (amd64) check for this PR."
      - name: Check all suites passed
        if: ${{ needs.decide-spyre-test.outputs.owns == 'true' }}
        run: |-
          if ${{ needs.run-tests.result == 'success' }}; then
            echo "All test suites passed."
            exit 0
          fi
          echo "Test suites failed, were cancelled, or did not run."
          exit 1
