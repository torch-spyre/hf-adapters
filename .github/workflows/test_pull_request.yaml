name: test_pull_request

# Doubles as hf-adapters' "trunk" (push-to-main) workflow -- on push this
# still runs every job unconditionally (job-selection for trunk == full,
# which is already this workflow's only mode), so the run-name below is
# purely a labeling change. Delegates its suite jobs to the same reusable
# _test_matrix.yaml used by integration-tests.yaml.
run-name: ${{ github.event_name == 'push' && 'trunk' || 'regression' }}

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      torch_spyre_ref:
        description: >-
          Accepted for dispatch-contract parity with torch-spyre; unused
          here (build-hf-adapters does not consume it).
        required: false
        type: string
        default: ""
      rpm_location:
        description: >-
          Accepted for dispatch-contract parity with torch-spyre; unused
          here (build-hf-adapters does not consume it).
        required: false
        type: string
        default: ""
      rpm_names:
        description: >-
          Accepted for dispatch-contract parity with torch-spyre; unused
          here (build-hf-adapters does not consume it).
        required: false
        type: string
        default: ""
      ref:
        description: Branch, tag, or SHA of hf-adapters to check out and test
        required: false
        type: string
        default: ""
      repository:
        description: |
          Full clone URL of the hf-adapters fork to check out (e.g.
          "https://github.com/myuser/hf-adapters.git"); leave empty for the base repo.
          Used by the cross-repo Test-With: flow to test a companion fork/branch.
        required: false
        type: string
        default: ""
      pr_url_hash:
        description: |
          Hash of the full URL of the PR that triggered this run.
          Sent by the internal integration pipeline; unused on push/PR.
        required: false
        type: string
        default: ""
      build_torch_spyre:
        description: Accepted for dispatch-contract parity with torch-spyre; unused here.
        required: false
        type: boolean
        default: true
      runner_label:
        description: |
          Per-PR ephemeral runner-set IMAGE label to select for runs-on
          (image_hf_adapters_pr_<component>_<sha12>, e.g.
          image_hf_adapters_pr_flex_8ddcf3e155e9). The per-PR ephemeral flow passes
          that PR's set label so jobs land on the per-PR image (the changed RPM is
          baked in -> no runtime sudo). Empty keeps push/PR runs on the
          standing image_torch_spyre set (today's behaviour).
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  # actions: read is required by _test_matrix.yaml's collect-failed-suites job to list/download failed-suite-* artifacts via the REST API; reusable workflows can only narrow the caller's permissions, so this must be granted here too.
  actions: read

jobs:
  # ---------------------------------------------------------------------------
  # Delegates to the shared _test_matrix.yaml (pre-commit, mypy, check-uv-lock,
  # adapter-coverage, matrix generation, and every spyre-*-tests /
  # spyre-model-module-tests suite). test_type is left at its default
  # ("regression" -- everything), matching this workflow's historical
  # behavior of always running the full suite.
  # ---------------------------------------------------------------------------
  run-tests:
    # Skip entirely once auto_merge is enabled on the PR -- native GHA checks aren't required there; run-spyre-unit-tests below still reports green since "skipped" isn't a failure.
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.auto_merge != null) }}
    uses: ./.github/workflows/_test_matrix.yaml
    with:
      # Per-PR ephemeral image label when provided, else the standing set for this event.
      image_label: ${{ inputs.runner_label || 'image_torch_spyre' }}
      extra_test_flags: -vvv -s
      extra_test_flags_multi_spyre: -vvv -s
      ref: ${{ inputs.ref || '' }}
      repository: ${{ inputs.repository || '' }}

  # ----------------------------------------------------------------------------------
  # Required check gate -- wraps the delegated suite run so a single branch
  # protection rule ("tests / run spyre unit tests") tracks one stable job name.
  # ----------------------------------------------------------------------------------
  # The .github/scripts ingest tests sit outside pytest's testpaths (["tests"]) and no other
  # job collects them, so they would pass locally and run nowhere. Standalone by design: they
  # stub clickhouse_connect and load the scripts by path, needing none of the product venv.
  ingest-script-tests:
    name: ingest script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.12"

      - name: Run the ingest script tests
        run: |
          uv run --no-project \
            --with pytest --with lxml --with clickhouse-connect \
            --with "git+https://github.com/torch-spyre/torch-spyre@main#subdirectory=extensions/clickhouse-ingest" \
            pytest .github/scripts -q -p no:cacheprovider -o addopts=""

  run-spyre-unit-tests:
    name: run spyre unit tests
    runs-on: ubuntu-latest
    needs: [run-tests]
    if: always()
    steps:
      - name: Check all suites passed
        run: |-
          if ${{ contains(needs.run-tests.result, 'failure') || contains(needs.run-tests.result, 'cancelled') }}; then
            echo "One or more test suites failed."
            exit 1
          fi
          echo "All test suites passed."
