name: LM evaluation

on:
  pull_request:
    paths:
      - ".github/workflows/lm-eval.yaml"
      - ".github/workflows/_lm-eval.yaml"
      - "evals/lm_eval/**"
      - "tests/model_lists/perf.yaml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      config:
        description: Benchmark YAML/JSON path in this checkout
        type: string
        default: evals/lm_eval/benchmarks.yaml
      models:
        description: Space-separated model paths; empty uses perf.yaml nightly.models
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: lm-eval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/_lm-eval.yaml
    secrets: inherit
    with:
      config: ${{ inputs.config || 'evals/lm_eval/benchmarks.yaml' }}
      models: ${{ inputs.models || '' }}
      prebaked_image: true
