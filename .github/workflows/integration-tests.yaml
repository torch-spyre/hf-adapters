name: integration-tests
run-name: integration-tests (${{ inputs.test_type || 'integration' }})
# NOTE: run-name intentionally shows the RAW, user-facing input -- smoke/unit/
# integration/regression/trunk are literal, first-class values (no
# alias-resolution layer; see _test_matrix.yaml's resolve-test-type job,
# which only applies the shared empty->regression default) -- this is also
# what push-to-clickhouse.yaml's trigger_type ends up recording, so
# ClickHouse sees the tier name callers actually asked for.

# ---------------------------------------------------------------------------
# Triggered by commits in upstream dependant repos (deeptools, flex, torch-spyre etc.) via
# workflow_dispatch. Runs the smoke suite (test_type default: "integration") against a
# specified hf-adapters ref so regressions from upstream changes are caught
# early without paying for the full matrix on every upstream commit; pass
# test_type/models explicitly for a broader check.
#
# Example caller pattern from an upstream repo's workflow:
#
#   gh workflow run integration-tests.yaml \
#     --repo <org>/hf-adapters \
#     -f triggering_repo=<repo link to deeptools/flex> \
#     -f triggering_sha=${{ github.sha }} \
#     -f pr_url_hash=$(echo -n "${{ github.event.pull_request.html_url }}" | sha256sum | cut -c1-16)
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      # ---- Upstream provenance ----------------
      triggering_repo:
        description: Name of the upstream repo that triggered this run (e.g. "deeptools", "flex", "torch-spyre")
        required: false
        type: string
        default: ''
      triggering_sha:
        description: Commit SHA in the upstream repo that triggered this run
        required: false
        type: string
        default: ''
      pr_url_hash:
        description: |
          Hash of the full URL of the upstream PR that triggered this run.
          Used to key the concurrency group so that re-runs for the same PR
          cancel any in-flight run. Leave empty for non-PR triggers.
        required: false
        type: string
        default: ''

      # ---- hf-adapters ref to test ----------
      ref:
        description: Branch, tag, or SHA of hf-adapters to check out and test
        required: false
        type: string
        default: ''
      repository:
        description: Full clone URL of a hf-adapters fork (e.g. "https://github.com/myuser/hf-adapters.git"); leave empty for the base repo
        required: false
        type: string
        default: ''

      # ---- image overrides ------------------
      runner_label:
        description: |
          Per-PR ephemeral runner-set IMAGE label
          (image_torch_spyre_pinned_pr_<component>_<sha12>).
          Leave empty to use the standing image_torch_spyre set.
        required: false
        type: string
        default: ''
      test_type:
        description: >-
          Test tier to run: unit | integration | regression | trunk -- literal,
          first-class values (no alias-resolution layer), for callers (e.g.
          spyre-frameworks config.yaml) that speak in tier names. "unit" runs
          every suite except smoke (load, token_compare, model_components,
          embed_compare, vlm, reranker_compare, masked_lm_compare,
          question_answering_compare, token_classification_compare,
          model_module); "integration" runs token_compare
          and model_components (there is no separate "smoke" tier/dropdown
          option; "smoke" remains reachable as an individual suite key through
          a raw space-separated combo via the API/gh CLI, e.g.
          "smoke token_compare"); "regression"/"trunk"
          run everything (trunk mirrors this repo's push-to-main CI label —
          see resolve_test_type.sh). This is a plain string underneath (see
          _test_matrix.yaml's resolve-test-type job), so a caller using the
          API/gh CLI can pass such a combo for finer control than the
          dropdown offers -- but GitHub validates `choice` options against
          the REST API dispatch too, not just the web UI dropdown, so every
          value a real caller sends (like the "unit"/"trunk" tiers above)
          must be listed explicitly below.
        required: false
        type: choice
        default: integration
        options:
          - unit
          - integration
          - regression
          - trunk
      models:
        description: >-
          Space-separated list of model paths to restrict every matrix job
          (smoke/load/token-compare/embed-compare/vision/reranker-compare) to, e.g.
          "Qwen/Qwen3-0.6B mistralai/Ministral-3-8B-Instruct-2512". Must match
          paths exactly as they appear in tests/model_registry.py -- any
          registered path works, not just the smallest-per-adapter default
          used when this input is left empty. Leave empty (default) to fall
          back to the model list in tests/model_lists/integration.yaml when
          test_type is "integration" (the default), or to every registered
          model per suite for any other test_type -- see run-tests below.
          An explicit models value applies to every test_type, including
          "integration".
        required: false
        type: string
        default: ''

concurrency:
  # PR-context runs (native pull_request, or workflow_dispatch carrying a
  # pr_url_hash) key on the PR itself, so re-triggering the same PR cancels its
  # own stale in-flight run -- unchanged from before.
  #
  # A non-PR dispatch (scheduled/main-push/nightly/weekly -- pr_url_hash empty)
  # previously fell back to bare github.ref, so EVERY such dispatch of this
  # workflow on the same ref shared one group regardless of test_type. Two
  # unrelated dispatches landing close together (e.g. a nightly trunk run while
  # a push-triggered trunk run is still going) then cancelled each other via
  # cancel-in-progress, silently killing a run mid-job with no test failure and
  # no error -- see the run/job-level symptoms this fixes. Disambiguating by
  # test_type stops different suites from colliding at all.
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.event.pull_request.html_url) || (github.event_name == 'workflow_dispatch'
    && inputs.pr_url_hash != '' && inputs.pr_url_hash) || format('{0}-{1}', github.ref, inputs.test_type) }}
  # Only cancel for a PR-context run (re-running the same PR should supersede
  # its own stale run). A non-PR dispatch is never "the same PR re-triggered" --
  # cancelling it destroys a run that has nothing superseding it, so a same
  # test_type/ref collision QUEUES behind the in-flight run instead of killing it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.pr_url_hash != '') }}

permissions:
  contents: read
  checks: write
  # actions: read is required by _test_matrix.yaml's collect-failed-suites job to list/download failed-suite-* artifacts via the REST API; reusable workflows can only narrow the caller's permissions, so this must be granted here too.
  actions: read

jobs:
  # ---------------------------------------------------------------------------
  # Print a summary of what triggered this run so it is tracked
  # ---------------------------------------------------------------------------
  provenance:
    name: Log upstream dependant tool regression trigger
    runs-on: ubuntu-latest
    steps:
      - name: Show trigger info
        run: |
          {
            echo "## Integration test triggered by upstream change"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Upstream repo   | ${{ inputs.triggering_repo || '(not specified)' }} |"
            echo "| Upstream commit | ${{ inputs.triggering_sha || '(not specified)' }} |"
            echo "| PR URL hash     | ${{ inputs.pr_url_hash || '(not specified)' }} |"
            echo "| hf-adapters ref | ${{ inputs.ref || github.sha }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Read tests/model_lists/integration.yaml and emit a space-separated model
  # list as a step output. Only runs when test_type is "integration" (the
  # default); for all other tiers the output is left empty so _test_matrix.yaml
  # runs its full registry.
  # ---------------------------------------------------------------------------
  resolve-models:
    name: Resolve integration model list
    needs: provenance
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.read-models.outputs.models }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}
          repository: ${{ inputs.repository != '' && inputs.repository || github.repository }}
          sparse-checkout: tests/model_lists/integration.yaml
          sparse-checkout-cone-mode: false
      - name: Read integration model list
        id: read-models
        run: |
          set -euo pipefail
          if [[ "${{ inputs.test_type || 'integration' }}" != "integration" ]]; then
            # Non-integration tiers get '' -> _test_matrix.yaml runs full registry.
            echo "models=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # yq (mikefarah/yq) is preinstalled on ubuntu-latest runners.
          models=$(yq '.models | join(" ")' tests/model_lists/integration.yaml)
          if [[ -z "${models}" || "${models}" == "null" ]]; then
            echo "tests/model_lists/integration.yaml has no models" >&2
            exit 1
          fi
          echo "models=${models}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Delegates to the same reusable _test_matrix.yaml used by "run-tests" in
  # torch_spyre_tests.yaml. `test_type` defaults to "integration" (token compare
  # plus model components); if `models` is left empty AND test_type is
  # "integration", it falls back to tests/model_lists/integration.yaml (all causal-
  # only) -- so upstream-triggered runs stay fast by default. For any other
  # test_type (unit/regression/trunk/a suite-key combo), an empty `models`
  # instead passes '' through to _test_matrix.yaml, which means "no restriction"
  # there -- every suite (incl. vision/embed/reranker, which the integration
  # spot-check has none of) runs its full registry. Without this split, the
  # spot-check default would starve spyre-vlm-e2e-tests/spyre-embed-compare-tests
  # of any matrix entries under test_type: regression (0-model matrix -> job
  # never runs, not even a failure -- see the "run spyre unit tests" gate).
  # An explicit `models` value always wins outright, for every test_type.
  # ---------------------------------------------------------------------------
  run-tests:
    needs: [provenance, resolve-models]
    uses: ./.github/workflows/_test_matrix.yaml
    with:
      image_label: ${{ inputs.runner_label || 'image_torch_spyre' }}
      extra_test_flags: -vvv -s
      extra_test_flags_multi_spyre: -vvv -s
      ref: ${{ inputs.ref || '' }}
      repository: ${{ inputs.repository || '' }}
      test_type: ${{ inputs.test_type || 'integration' }}
      models: ${{ (inputs.models != '' && inputs.models) || needs.resolve-models.outputs.models || '' }}

  # ----------------------------------------------------------------------------------
  # Fan-in gate job so callers can poll a single stable job name for pass/fail.
  # ----------------------------------------------------------------------------------
  integration-test-result:
    name: Integration test result
    runs-on: ubuntu-latest
    needs: run-tests
    if: always()
    steps:
      - name: Evaluate test results
        run: |
          RESULT="${{ needs.run-tests.result }}"
          echo "run-tests result: ${RESULT}"

          if [[ "${RESULT}" == "success" ]]; then
            echo "All integration test suites passed."
            exit 0
          fi

          echo "One or more integration test suites failed or were cancelled."
          exit 1
