name: Build hf-adapters
description: >
  Install hf-adapters and its dependencies using uv.
  The uv_groups input controls which dependency groups are installed.

inputs:
  uv_groups:
    description: >
      Space-separated list of uv groups to install (e.g. "dev test" or "dev spyre test").
    required: true
  ref:
    description: >
      Branch, tag, or SHA of hf-adapters to check out. Empty = the PR/push head
      (today's behaviour). Set by the cross-repo Test-With: flow to test a companion ref.
    required: false
    default: ''
  repository:
    description: >
      Full clone URL of the hf-adapters fork to check out (e.g.
      https://github.com/myuser/hf-adapters.git). Empty = the base repo
      ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY). Set by the Test-With: flow.
    required: false
    default: ''
outputs:
  target_sha:
    description: The resolved commit SHA that was checked out
    value: ${{ steps.resolve-sha.outputs.target_sha }}


runs:
  using: composite
  steps:
    - name: Checkout target commit
      id: resolve-sha
      shell: bash
      working-directory: /home/senuser
      env:
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_REF: ${{ github.ref }}
        # Cross-repo Test-With: overrides. Empty = today's behaviour (base repo, PR/push head).
        INPUT_REF: ${{ inputs.ref }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
      run: |
        source "$HOME/.bashrc"
        source /etc/profile.d/ibm-aiu-setup.sh
        git config --global --add safe.directory '*'
        rm -fr "$CLONED_HF_ADAPTERS_DIR"
        CLONE_URL="${INPUT_REPOSITORY:-$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git}"
        # Accept a bare "owner/repo" (the format callers like spyre-frameworks'
        # run_integration_tests.py normalize to, matching actions/checkout's own
        # convention) in addition to the documented full clone URL -- this step
        # does a raw `git clone`, which treats a schemeless string as a local path
        # ("fatal: repository 'owner/repo' does not exist") instead of resolving it
        # against github.com.
        if [[ -n "$INPUT_REPOSITORY" && "$CLONE_URL" != *"://"* ]]; then
          CLONE_URL="$GITHUB_SERVER_URL/${CLONE_URL%.git}.git"
        fi
        if [[ -n "$INPUT_REF" || -n "$INPUT_REPOSITORY" ]]; then
          git clone "$CLONE_URL" "$CLONED_HF_ADAPTERS_DIR"
        else
          git clone --depth=1 "$CLONE_URL" "$CLONED_HF_ADAPTERS_DIR"
        fi
        cd "$CLONED_HF_ADAPTERS_DIR"
        if [[ -n "$INPUT_REF" ]]; then
          # Explicit ref (Test-With: companion fork/branch).
          TARGET_REF="$INPUT_REF"
          echo "TARGET_REF=${TARGET_REF} (from input.ref)"
          git fetch --tags --force origin "+${TARGET_REF}:refs/remotes/origin/_target" || \
            git fetch --tags --force origin
          git checkout --force "${TARGET_REF}" 2>/dev/null || git checkout --force origin/_target
          TARGET_SHA="$(git rev-parse HEAD)"
        else
          TARGET_SHA="${PR_HEAD_SHA:-$GITHUB_SHA}"
          TARGET_REF="${PR_HEAD_REF:-$GITHUB_REF}"
          echo "TARGET_REF=${TARGET_REF}"
          echo "TARGET_SHA=${TARGET_SHA}"
          git fetch --tags --force origin "+${TARGET_SHA}" || \
            git fetch --tags --force origin
          git checkout --force "${TARGET_SHA}"
        fi
        git log -1 --oneline
        echo "target_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"

    - name: Gather runner info
      uses: ./.github/actions/gather-runner-info
      with:
        verbose: 'true'


    - name: Build hf-adapters
      shell: bash
      working-directory: /home/senuser
      env:
        UV_GROUPS: "${{ inputs.uv_groups }}"
        INPUT_REF: ""
      run: |
        source "$HOME/.bashrc"
        source /etc/profile.d/ibm-aiu-setup.sh
        git config --global --add safe.directory '*'

        # -------------------------------------------------------------------
        # Diagnostics: `uv: command not found` (exit 127) has been observed
        # intermittently here. The runner set is a single image/scaleSet, so
        # runners MUST be identical -- if uv is present on some and not others,
        # that divergence is a bug to find, not to paper over. These probes
        # capture the exact environment that determines whether uv resolves,
        # on every run (pass or fail), so a failing run is self-explanatory.
        # All non-fatal (|| true) so the step's `-e` never aborts on a probe.
        # -------------------------------------------------------------------
        echo "::group::uv/PATH diagnostics"
        echo "RUNNER_NAME=${RUNNER_NAME:-<unset>}  GHA_RUNNER_POD_NODE_NAME=${GHA_RUNNER_POD_NODE_NAME:-<unset>}  HOSTNAME=$(hostname)"
        echo "whoami: $(id)"
        echo "shell: $0  flags: $-"
        echo "PATH=$PATH"
        echo "command -v uv: $(command -v uv || echo '<not found>')"
        echo "which -a uv:"; which -a uv || true
        echo "ls -al \$HOME/.local/bin:"; ls -al "$HOME/.local/bin" || true
        echo "ls -al of any uv on disk:"; ls -al "$HOME/.local/bin/uv" /usr/local/bin/uv /usr/bin/uv 2>/dev/null || true
        echo "uv --version: $(uv --version 2>&1 || echo '<uv not runnable>')"
        echo "head -40 \$HOME/.bashrc (does the non-interactive guard skip the PATH export?):"
        head -40 "$HOME/.bashrc" || true
        echo "::endgroup::"

        # Tests use `uv run --active --no-sync`. Install into that same
        # environment, not a second .venv under the checkout. The image owns
        # Torch's native build (in particular on ppc64le, without a CPU wheel).
        # Resolve dependencies without an implicit sync, then leave Torch and
        # unrelated image packages intact in the one explicit sync below.
        : "${VIRTUAL_ENV:?The runner must activate its Python environment}"
        export UV_PROJECT_ENVIRONMENT="$VIRTUAL_ENV"
        CI_PYTHON="$VIRTUAL_ENV/bin/python"
        test -x "$CI_PYTHON"
        TORCH_FINGERPRINT='import hashlib, json, pathlib, torch; p = pathlib.Path(torch._C.__file__); print(json.dumps([torch.__version__, str(p.resolve()), hashlib.sha256(p.read_bytes()).hexdigest()]))'
        TORCH_BEFORE=$(TORCH_DEVICE_BACKEND_AUTOLOAD=0 "$CI_PYTHON" -c "$TORCH_FINGERPRINT")

        # Build group flags from space-separated list
        GROUP_FLAGS=""
        for group in $UV_GROUPS; do
          GROUP_FLAGS="$GROUP_FLAGS --group $group"
        done

        if [[ -n "$INPUT_REF" ]]; then
          cd /home/senuser/torch-spyre
          TARGET_SHA="$INPUT_REF"
          TARGET_REF="$INPUT_REF"
          echo "TARGET_REF=${TARGET_REF}"
          echo "TARGET_SHA=${TARGET_SHA}"
          git fetch --tags --force origin "+${TARGET_SHA}" || \
            git fetch --tags --force origin
          git checkout --force "${TARGET_SHA}"
          git submodule sync --recursive
          git submodule update --init --recursive --force
          git log -1 --oneline
          cd "$CLONED_HF_ADAPTERS_DIR"
          uv add --no-sync torch-spyre /home/senuser/torch-spyre
        else
          cd "$CLONED_HF_ADAPTERS_DIR"
          # though we pin to main
          # frozen installation takes pinned commit when locked
          # we want to relax on torch-spyre to use floating version
          # and have other dependencies locked
          uv add --no-sync torch-spyre /home/senuser/torch-spyre
          uv lock --upgrade-package torch-spyre
        fi
        uv sync --active --frozen --inexact --no-install-package torch --verbose --refresh $GROUP_FLAGS
        TORCH_AFTER=$(TORCH_DEVICE_BACKEND_AUTOLOAD=0 "$CI_PYTHON" -c "$TORCH_FINGERPRINT")
        if [[ "$TORCH_BEFORE" != "$TORCH_AFTER" ]]; then
          echo "::error::Dependency installation changed the image's native Torch build"
          exit 1
        fi
        uv pip check --python "$CI_PYTHON"
        # Exercise exactly the interpreter-selection path used by Makefile.
        # Fail during setup, rather than dispatching a suite with missing deps.
        uv run --active --no-sync python - <<'PY'
        import os
        import pathlib
        import sys
        import torch
        import transformers
        import torch_spyre

        assert pathlib.Path(sys.prefix).resolve() == pathlib.Path(os.environ["VIRTUAL_ENV"]).resolve()
        if "oot" in os.environ["UV_GROUPS"].split():
            import oot_framework
        print(f"Test interpreter: {sys.executable}; torch: {torch.__version__}; transformers: {transformers.__version__}")
        PY
        uv pip show torch
        uv pip freeze
