name: Mark a pod-level retry's JUnit report
description: >-
  Call with if: always() from a *-retry job, after its tests and before the
  upload that overwrites the first attempt's report. Stamps every testcase
  result.retried=pod and, from the first attempt's report, keeps each earlier
  failure as result.prior_status/result.prior_message. Never fails the job.

inputs:
  artifact_name:
    description: Artifact name the retry's upload overwrites (the first attempt's report).
    required: true
  report:
    description: The retry's JUnit XML, as passed to the upload's path (relative to the workspace or absolute).
    required: true
  helper_url:
    description: >-
      torch-spyre's mark_retried.py. Stdlib-only, so it is fetched and run by path rather than
      installed; @main, like the ingest that reads its marks.
    required: false
    default: https://raw.githubusercontent.com/torch-spyre/torch-spyre/main/extensions/clickhouse-ingest/spyre_clickhouse_ingest/mark_retried.py

runs:
  using: composite
  steps:
    - name: Download the first attempt's JUnit report
      continue-on-error: true
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ runner.temp }}/replaced-report

    - name: Mark the retry's report
      shell: bash
      env:
        REPORT: ${{ inputs.report }}
        HELPER_URL: ${{ inputs.helper_url }}
      run: |
        set +e
        warn() {
          echo "::warning::$1"
          echo "- :warning: ${GITHUB_JOB}: $1" >> "$GITHUB_STEP_SUMMARY"
        }
        [[ "$REPORT" = /* ]] || REPORT="${GITHUB_WORKSPACE}/${REPORT}"
        if [[ ! -f "$REPORT" ]]; then
          # The XML-only upload then has nothing to send, so the first attempt's report stays.
          warn "no retry report at ${REPORT}; the first attempt's report is kept unmarked"
          exit 0
        fi
        # A single-file upload stores only the basename; fall back to the artifact's sole XML.
        replaced_dir="${RUNNER_TEMP}/replaced-report"
        replaced="${replaced_dir}/$(basename "$REPORT")"
        if [[ ! -f "$replaced" ]]; then
          shopt -s nullglob
          xmls=("$replaced_dir"/*.xml)
          replaced=""
          [[ ${#xmls[@]} -eq 1 ]] && replaced="${xmls[0]}"
        fi
        [[ -n "$replaced" ]] || warn "first attempt's report not found; marking retried=pod only"
        helper="${RUNNER_TEMP}/mark_retried.py"
        curl -fsSL --retry 3 -o "$helper" "$HELPER_URL" \
          && python3 -I "$helper" pod "$REPORT" ${replaced:+"$replaced"} \
          || warn "mark_retried failed; the report is uploaded unmarked"
        exit 0
