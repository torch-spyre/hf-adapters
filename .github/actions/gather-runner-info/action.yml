name: Gather runner info
description: |
  Prints diagnostic information about the GHA runner: identity, key paths,
  Python version, installed RPMs, and (optionally) a full env dump and a
  directory listing of the pre-cloned torch-spyre repo.

inputs:
  verbose:
    description: |
      When 'true', also dumps sorted env, AIU env vars, and a directory
      listing of the pre-cloned repo. Defaults to 'false' for a terse log.
    required: false
    default: 'false'
  torch_spyre_dir:
    description: Path to the pre-cloned torch-spyre directory
    required: false
    default: /home/senuser/torch-spyre
  runner_labels:
    description: |
      The runner-label selectors the caller requested in its `runs-on`
      (a JSON array string, e.g. '["x86_64","spyre_pf_x1","linux",
      "image_spyre_backend"]'). The matrix strategy parameterizes these
      per job, so echoing them shows which labels routed this specific
      run. Optional: when empty, only the resolved runner identity is
      printed.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Gather runner info
      shell: bash
      working-directory: /home/senuser
      env:
        VERBOSE: ${{ inputs.verbose }}
        TORCH_SPYRE_DIR: ${{ inputs.torch_spyre_dir }}
        # The runner-label selectors the caller passed to `runs-on`. GHA
        # does not expose the resolved `runs-on` array to the running job,
        # so the caller forwards the exact expression it used.
        REQUESTED_RUNNER_LABELS: ${{ inputs.runner_labels }}
        # Built-in contexts describing the runner GHA actually selected.
        RUNNER_NAME: ${{ runner.name }}
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        source "$HOME/.bashrc"
        source /etc/profile.d/ibm-aiu-setup.sh
        echo "================================="
        MY_DELIM='---------------------------------'
        echo "--- runner labels ---"
        # Requested labels: the `runs-on` selectors the matrix job asked
        # for. Resolved identity: the runner GHA matched to them. Together
        # these make it clear which labels a given run used.
        echo "REQUESTED_RUNNER_LABELS ${REQUESTED_RUNNER_LABELS:-<none>}"
        echo "RUNNER_NAME $RUNNER_NAME"
        echo "RUNNER_OS $RUNNER_OS"
        echo "RUNNER_ARCH $RUNNER_ARCH"
        echo "$MY_DELIM"
        date
        echo "$MY_DELIM"
        pwd
        ls -la
        echo "$MY_DELIM"
        whoami
        id
        echo "GHA_RUNNER_POD_NODE_NAME $GHA_RUNNER_POD_NODE_NAME"
        echo "PATH $PATH"
        echo "HOME $HOME"
        echo "TORCH_ROOT ${TORCH_ROOT:-<unset>}"
        echo "$MY_DELIM"
        echo "Installed RPMs"
        cat "$HOME/installed_rpms.txt" || true
        echo "$MY_DELIM"
        python3 --version
        python3 -c 'import sys; print(sys.path)'
        if [[ "$VERBOSE" == 'true' ]]; then
          echo "--- env ---"
          env | sort
          echo "--- AIU env ---"
          env | sort | grep AIU || true
          echo "--- repo listing ---"
          echo "TORCH_SPYRE_DIR $TORCH_SPYRE_DIR"
          ls -lart "$TORCH_SPYRE_DIR" || true
          if [[ -d "$TORCH_SPYRE_DIR" ]]; then
            echo "--- torch-spyre HEAD ---"
            git -C "$TORCH_SPYRE_DIR" log -n 1 --oneline || true
          fi
        fi
        echo "================================="
