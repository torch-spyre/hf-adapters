[project]
name = "hf-adapters-spyre"
version = "0.1.0"
description = "Minimal runtime patches that make stock HuggingFace Transformers models run on Spyre accelerators"
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.11,<3.15"
dependencies = [
    "torch>=2.0",
    "transformers>=5.12.1,<6.0.0",
    "sentencepiece",
    "accelerate",
    "sentence_transformers",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hf_adapters"]

[tool.black]
line-length = 88
# Lowest version in requires-python; dropping py310 keeps these in step with it.
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = [
    "E501",  # Line too long
    "N806",  # Variable in function should be lowercase (allow B, H, L, D, etc.)
    "N812",  # Lowercase imported as non-lowercase (allow F for functional)
]

[tool.mypy]
# python_version is deliberately unset: mypy then analyzes as the interpreter it runs
# under, which is what keeps it consistent with the numpy version resolved for that
# interpreter. uv.lock pins numpy per interpreter (2.3.5 below 3.13, 2.5.1 at 3.13+),
# and numpy 2.5.1's bundled stubs use PEP 695 `type X = ...` aliases. Pinning this to
# 3.10 made mypy reject those stubs as a syntax error and abort before checking a
# single project file; pinning it to any fixed value re-breaks on some interpreter.
# See requires-python above for the supported range.
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
files = ["hf_adapters/**/*.py"]

# sympy ships no py.typed marker (PEP 561), so mypy refuses to analyze it.
[[tool.mypy.overrides]]
module = "sympy.*"
ignore_missing_imports = true

# deepspec is an undeclared optional dependency, present only where the DSpark
# drafters run. The adapters import it lazily inside functions for that reason, so
# its absence is expected off-pod and must not be a type error.
[[tool.mypy.overrides]]
module = "deepspec.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Spyre-pod-only tests live under tests/spyre/. They import torch_spyre and
# need DEVICE="spyre" (the parent tests/conftest.py CPU-patches hf_adapters
# for the rest of the tests/ tree). Default pytest runs from the repo root
# skip them so a CPU host can run `pytest tests/`. CI on the pod overrides
# this by passing the explicit path: `pytest tests/spyre/...`.
addopts = "--ignore=tests/spyre"
markers = [
    "slow: deselected by default; opt in with --run-slow",
]

[tool.uv.sources]
torch-spyre = { git = "https://github.com/torch-spyre/torch-spyre", rev = "main" }
oot-framework = { git = "https://github.com/torch-spyre/torch-spyre", subdirectory = "tests/oot_framework", rev = "main" }
# torch resolves to the +cpu build (via torch-spyre's index). torchvision must
# come from the SAME PyTorch CPU index or PyPI hands us a CUDA-built wheel whose
# C++ ops fail to register against +cpu torch.
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
spyre = ["torch-spyre"]
oot = ["oot-framework"]
dev = [
    "pre-commit>=3.5.0",
    "black>=26.3.1",
    "ruff>=0.15.6",
    "mypy>=1.14.0,<2",
    "typing-extensions",
    "nicegui",
    "clickhouse-connect>=1.4.1",
    "lxml",
    "clickhouse-driver"
]
models-ops = [
    "huggingface_hub",
    "mistral_common",
    "python-dotenv",
    "PyYAML",
    "regex",
]
test = [
    "pytest>=9.0,<9.1",
    "Pillow",
    "torchvision~=0.28.0",
]
